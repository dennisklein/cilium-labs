# Pods labelled egress=true reach 10.30.2.0/24 via gateway A, SNATed to 10.30.1.100
apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata: {name: via-gateway}
spec:
  selectors:
  - podSelector:
      matchLabels: {egress: "true"}
  destinationCIDRs: ["10.30.2.0/24"]
  egressGateway:
    nodeSelector:
      matchLabels: {egress-gw: "a"}
    egressIP: 10.30.1.100
