name: cilium-egress
topology:
  nodes:
    router:
      kind: linux
      image: nicolaka/netshoot:latest
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr add 10.30.1.254/24 dev eth1
        - ip addr add 10.30.2.254/24 dev eth2
        - ip addr add 10.30.3.254/24 dev eth3
    server:                      # the "outside world": logs the source IP of every request
      kind: linux
      image: nginx:1.31-alpine
      exec:
        - ip addr add 10.30.2.2/24 dev eth1
        - ip route add 10.30.0.0/16 via 10.30.2.254
    # Existing kind node containers; names must match exactly
    egress-worker:  {kind: ext-container}
    egress-worker2: {kind: ext-container}
  links:
    - endpoints: ["router:eth1", "egress-worker:eth1"]
    - endpoints: ["router:eth2", "server:eth1"]
    - endpoints: ["router:eth3", "egress-worker2:eth1"]
