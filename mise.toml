# Toolchain and environment for the Cilium labs. Run `mise install` once; `mise activate` (or `mise run`/`mise x`) loads [env].
[tools]
kubectl = "latest"
kind = "latest"
helm = "latest"
cilium-cli = "latest"
jq = "latest"
"github:srl-labs/containerlab" = "latest"
"github:cilium/hubble" = "latest"
envsubst = "latest"

[env]
CILIUM_VERSION = "1.20.3"
CLUSTER = "lab"   # must match `name:` in the stage's kind.yaml
